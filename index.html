<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta name="theme-color" content="#F4F5FB" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Trakka — Benin City logistics, optimized</title>
  <meta name="description" content="Trakka helps independent fleet owners receive delivery orders through WhatsApp, protect margins, batch routes, dispatch riders, and give customers a live tracking link without an app." />
  <meta name="keywords" content="logistics software Nigeria, delivery tracking software, courier management platform, dispatch software Lagos, real-time package tracking, SME logistics tools" />
  <link rel="canonical" href="https://trakka.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Trakka — Benin City logistics, optimized" />
  <meta property="og:description" content="Receive WhatsApp orders, protect margins, batch routes, dispatch riders, and give customers a live no-login tracking page." />
  <meta property="og:url" content="https://trakka.app/" />
  <meta property="og:site_name" content="Trakka" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Trakka — Benin City logistics, optimized" />
  <meta name="twitter:description" content="Receive WhatsApp orders, protect margins, batch routes, dispatch riders, and give customers a live no-login tracking page." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script>
    (() => {
      const saved = localStorage.getItem('trakka-theme')
      const theme = saved || 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
    })()
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Trakka",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Logistics operating system for Nigerian SME couriers, dispatch businesses, and 3PLs — delivery management, driver assignment, live GPS tracking, and in-app payments.",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "NGN"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
