<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#f9f9ff" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Trakka: logistics management software for dispatch businesses</title>
  <meta name="description" content="Receive orders through WhatsApp, protect margins, group routes by neighbourhood, dispatch riders and give every customer a live delivery view. Private pilot in Benin City." />
  <meta name="keywords" content="logistics software Nigeria, delivery tracking software, courier management platform, dispatch software Lagos, real-time package tracking, SME logistics tools" />
  <link rel="canonical" href="https://www.trakka.online/" />

  <meta property="og:type" content="website" />
  <meta property="og:image" content="/share.jpg" />
  <meta property="og:title" content="Trakka: logistics management software for dispatch businesses" />
  <meta property="og:description" content="Receive orders through WhatsApp, protect margins, group routes by neighbourhood, dispatch riders and give every customer a live delivery view." />
  <meta property="og:url" content="https://trakka.app/" />
  <meta property="og:site_name" content="Trakka" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/share.jpg" />
  <meta name="twitter:title" content="Trakka: logistics management software for dispatch businesses" />
  <meta name="twitter:description" content="Receive orders through WhatsApp, protect margins, group routes by neighbourhood, dispatch riders and give every customer a live delivery view." />

  <link rel="preload" href="/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin />

  <script>
    (() => {
      const saved = localStorage.getItem('trakka-theme')
      const theme = saved || 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
    })()
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Trakka",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Logistics management software for Nigerian dispatch businesses: WhatsApp intake, batched routes, rider links, live customer tracking and QR proof of delivery.",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "NGN"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
